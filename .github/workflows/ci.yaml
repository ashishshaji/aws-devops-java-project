name: Java CI with Maven

# This workflow triggers on pushes and pull requests to the main branch
on:
  workflow_dispatch:
  # push:
  #   branches: [ "master" ]
#  pull_request:
#    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Change to '21' if you configured your pom.xml for Java 21
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game2048-jar
          # This path matches the default Maven output folder and JAR name
          path: target/game2048-0.0.1-SNAPSHOT.jar
