name: Java CI/CD with Maven

on:
  push:
    branches: [  "master" ]
  workflow_dispatch:

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean package --file pom.xml

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: game2048-jar
          path: target/game2048-0.0.1-SNAPSHOT.jar

      - name: Add build summary to GitHub Actions
        run: |
          echo "## 🔨 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "------------------" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build Status: success" >> $GITHUB_STEP_SUMMARY
          echo "📦 JAR Artifact: game2048-0.0.1-SNAPSHOT.jar" >> $GITHUB_STEP_SUMMARY
          echo "🕒 Build Time: $(date)" >> $GITHUB_STEP_SUMMARY

  CD:
    needs: CI
    runs-on: ubuntu-latest
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: game2048-jar
          path: ./dist

      - name: Stop application if running
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mkdir -p ~/game2048
            if [ -f ~/game2048/app.pid ] && kill -0 "$(cat ~/game2048/app.pid)" 2>/dev/null; then
              echo "Application is running. Stopping it..."
              kill "$(cat ~/game2048/app.pid)"
              sleep 3
              echo "Application stopped."
            else
              echo "Application is not running."
            fi

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "dist/game2048-0.0.1-SNAPSHOT.jar"
          target: "/home/${{ vars.VM_USER }}/game2048"
          strip_components: 1

      - name: Start application on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/game2048
            nohup java -jar game2048-0.0.1-SNAPSHOT.jar > app.log 2>&1 < /dev/null &
            echo $! > app.pid
            sleep 5
            tail -n 20 app.log

      - name: Add deployment summary to GitHub Actions
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "------------------" >> $GITHUB_STEP_SUMMARY
          echo "📦 Deployed JAR: game2048-0.0.1-SNAPSHOT.jar" >> $GITHUB_STEP_SUMMARY
          echo "🖥️ EC2 Host: ${{ vars.VM_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "👤 User: ${{ vars.VM_USER }}" >> $GITHUB_STEP_SUMMARY
          echo "🌐 URL: http://${{ vars.VM_HOST }}:8080" >> $GITHUB_STEP_SUMMARY
          echo "🕒 Deployment Time: $(date)" >> $GITHUB_STEP_SUMMARY